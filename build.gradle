plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}+${minecraft_version}" as Object
group = mod_group_id

repositories {
    mavenCentral()

    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }

    // PlayerAnimationLibrary
    maven {
        name = "RedlanceMinecraft"
        url = "https://repo.redlance.org/public"
    }

    // Curios
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    // GeckoLib
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }

    // JEI
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    // Terrablender
    maven { url = 'https://maven.minecraftforge.net/' }

    // Modrinth (Palladium previews, FancyTabSections)
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client1 {
            client()

            ideName = "Minecraft Client Dev"

            gameDirectory = project.file('run/client1')
            programArgument '--username'
            programArgument 'Dev'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Dnet.minecraft.client.tts=false'
        }

        client2 {
            client()

            ideName = "Minecraft Client Bandit"

            gameDirectory = project.file('run/client2')
            // Real Microsoft/Minecraft login via DevLogin (not --username).
            // First launch: the console will ask you to visit https://www.microsoft.com/link
            devLogin = true

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Dnet.minecraft.client.tts=false'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
    all {
        // Player Animation Library's POM requests newer gson/netty/slf4j/joml than Minecraft 26.1.2 allows.
        // Force Minecraft's pinned versions so Gradle can resolve PAL from Maven (no local fat jar).
        resolutionStrategy.force 'com.google.code.gson:gson:2.13.2'
        resolutionStrategy.force 'io.netty:netty-buffer:4.2.7.Final'
        resolutionStrategy.force 'org.slf4j:slf4j-api:2.0.16'
        resolutionStrategy.force 'org.joml:joml:1.10.8'
    }
}

dependencies {
    // Development Palladium Version
//    implementation files('libs/palladium-5.0.0+26.1.2.jar')
    implementation "maven.modrinth:palladium-previews:$palladium_version"

    // Player Animation Library (Maven; Palladium already jar-jars this for players)
    implementation "com.zigythebird.playeranim:PlayerAnimationLibNeo:$player_animation_lib_version"

    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Terrablender
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"

    // FancyTabSections
    implementation "maven.modrinth:fancytabsections:${fancytabsections_version}"

    // GeckoLib
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    interfaceInjectionData "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
